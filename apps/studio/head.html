<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hepta Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Azeret+Mono:wght@400;500&display=swap">
<style>
  :root{
    color-scheme:dark;
    --recessed:#0B1220; --base:#111827; --up:#1B2434; --line:rgba(233,238,247,.09);
    --ink:#E9EEF7; --dim:#9AA6BB; --faint:#6C7689;
    --assistant:#06B6D4; --ok:#34D399; --warn:#FB923C; --bad:#F87171;
    --mono:"Azeret Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{background:var(--recessed);color:var(--ink)}
  body{font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;padding:0 16px}
  .wrap{max-width:1320px;margin:0 auto;padding-block:20px 56px}
  .mono{font-family:var(--mono)}
  h1,h2,h3{margin:0;text-wrap:balance}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--assistant);outline-offset:2px}

  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:20px}
  .orb{width:34px;height:34px;border-radius:50%;flex:none;
       background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.75),var(--assistant) 42%,rgba(0,0,0,.35) 100%);
       box-shadow:0 0 24px color-mix(in srgb,var(--assistant) 45%,transparent);transition:background .6s,box-shadow .6s}
  header h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
  header p{margin:0;color:var(--dim);font-size:14px;max-width:60ch}
  .theme{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .theme .lbl{margin-right:2px}
  .sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0}
  .sw[aria-pressed="true"]{border-color:var(--ink)}
  .theme-msg{flex-basis:100%;text-align:right;font-size:12px;color:var(--warn);min-height:1em}

  .lbl{font:500 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .grid{display:grid;gap:18px;grid-template-columns:1fr}
  @media(min-width:1080px){.grid{grid-template-columns:300px minmax(0,1fr) 330px}}
  @media(min-width:760px) and (max-width:1079px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.centre{grid-column:1 / -1;order:-1}}
  .pane{display:flex;flex-direction:column;gap:14px;min-width:0}
  .panel{background:var(--base);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .panel h2{font-size:15px;font-weight:600}
  .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .note{color:var(--dim);font-size:13px;margin:0}

  /* apps */
  .app{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--recessed)}
  .app-top{display:flex;align-items:center;gap:10px}
  .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#0B1220;flex:none}
  .app-top b{font-weight:600}
  .app-top .state{margin-left:auto}
  .approve{font-size:13px;color:var(--dim);background:var(--up);border-radius:12px;padding:10px 12px;margin:0}
  .row-btns{display:flex;gap:8px;flex-wrap:wrap}
  .btn{min-height:40px;border-radius:999px;border:1px solid var(--line);background:transparent;padding:0 14px;font-size:13.5px}
  .btn:hover{background:rgba(233,238,247,.05)}
  .btn.primary{background:var(--ink);color:#0B1220;border-color:var(--ink);font-weight:600}
  .tools{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
  .tool{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
  .tool .n{font-family:var(--mono);font-size:12px}
  .pill{font:500 10.5px/1 var(--mono);letter-spacing:.06em;padding:5px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
  .pill.ask{color:var(--warn)} .pill.go{color:var(--ok)} .pill.read{color:var(--dim)} .pill.never{color:var(--bad)}
  .tool .let{margin-left:auto;min-height:32px;font-size:12px;padding:0 10px}
  .problems{font-size:12px;color:var(--warn);margin:0;padding-left:16px}

  /* stage */
  .stage-wrap{background:var(--recessed);border:1px solid var(--line);border-radius:24px;padding:18px;min-height:300px;display:flex;flex-direction:column;justify-content:center}
  .say{display:flex;gap:8px}
  .say input{flex:1;min-width:0;min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--recessed);color:var(--ink);padding:0 14px;font:inherit}
  .scenes{display:flex;gap:8px;flex-wrap:wrap}
  .scene{min-height:36px;border-radius:999px;border:1px solid var(--line);background:transparent;padding:0 12px;font-size:13px;color:var(--dim)}
  .scene:hover{color:var(--ink)}
  .why{font-size:13px;color:var(--dim);margin:0;min-height:1.4em}
  .why b{color:var(--ink);font-weight:500}

  /* conductor */
  .clock{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .clock .t{font:500 22px/1 var(--mono);font-variant-numeric:tabular-nums}
  .score{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
  .score li{display:flex;gap:8px;align-items:baseline}
  .score .ceil{margin-left:auto}
  .inbox{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto}
  .item{border-left:3px solid var(--faint);padding:6px 0 6px 10px;font-size:13px;display:flex;flex-direction:column;gap:4px}
  .item[data-kind="done"]{border-color:var(--ok)} .item[data-kind="waiting"]{border-color:var(--warn)}
  .item[data-kind="failed"]{border-color:var(--bad)} .item[data-kind="notice"]{border-color:var(--assistant)}
  .item .t{font-weight:500}
  .item .d{color:var(--dim);white-space:pre-wrap;word-break:break-word}
  .item .btn{align-self:flex-start;min-height:32px;font-size:12px}
  .empty{color:var(--faint);font-size:13px;margin:0}

  /* memory */
  .mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{background:var(--recessed);border-radius:12px;padding:10px}
  .stat .v{font:500 20px/1.1 var(--mono);font-variant-numeric:tabular-nums}
  .stat .k{font-size:11.5px;color:var(--dim)}
  .log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--dim);max-height:180px;overflow:auto}
  .log li{display:flex;gap:8px}
  .log .kind{font-family:var(--mono);font-size:11px;color:var(--faint);flex:none;width:64px}

  footer{margin-top:22px;color:var(--faint);font-size:12.5px;max-width:80ch}
  @media (prefers-reduced-motion: reduce){ .orb{transition:none} }
  /* Fingers are wider than cursors: every tap target is at least 44 px where the pointer is coarse. */
  @media (pointer:coarse){ .sw{width:44px;height:44px} .btn,.scene,.tool .let,.item .btn{min-height:44px} }
</style>
