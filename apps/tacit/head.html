<title>Tacit</title>
<meta name="description" content="Tacit, by Kairos. A voice-first companion that gets to know you, and says it once.">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* ---------------------------------------------------------------- tokens
     White and Kairos orange. A breath of slate blue for quiet things. */
  :root {
    --bg: #FFFFFF; --paper: #FAF8F5; --raised: #FFFFFF; --sunk: #F4F1EC;
    --ink: #1D1E22; --dim: #6B6E78; --faint: #9A9CA4; --line: rgba(29,30,34,.09); --line-strong: rgba(29,30,34,.16);
    --accent: #E8722C; --accent-deep: #C85A17; --accent-ink: #FFFFFF; --accent-soft: rgba(232,114,44,.10); --accent-glow: rgba(232,114,44,.28);
    --blue: #6F8FB6; --blue-soft: rgba(111,143,182,.12);
    --ok: #2F9E6B; --warn: #C27A12; --bad: #C8443B;
    --shadow: 0 1px 2px rgba(29,30,34,.04), 0 8px 28px rgba(29,30,34,.06);
    --display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    --stage-tint: 29,30,34;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #131417; --paper: #18191D; --raised: #1E2024; --sunk: #101114;
    --ink: #F2F0EB; --dim: #A3A5AD; --faint: #6E7079; --line: rgba(242,240,235,.08); --line-strong: rgba(242,240,235,.16);
    --accent: #F08A47; --accent-deep: #F5A06A; --accent-ink: #1A1206; --accent-soft: rgba(240,138,71,.13); --accent-glow: rgba(240,138,71,.30);
    --blue: #93AED0; --blue-soft: rgba(147,174,208,.12);
    --ok: #5CC795; --warn: #E3A54A; --bad: #E77A70;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); --stage-tint: 255,255,255; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #131417; --paper: #18191D; --raised: #1E2024; --sunk: #101114;
    --ink: #F2F0EB; --dim: #A3A5AD; --faint: #6E7079; --line: rgba(242,240,235,.08); --line-strong: rgba(242,240,235,.16);
    --accent: #F08A47; --accent-deep: #F5A06A; --accent-ink: #1A1206; --accent-soft: rgba(240,138,71,.13); --accent-glow: rgba(240,138,71,.30);
    --blue: #93AED0; --blue-soft: rgba(147,174,208,.12);
    --ok: #5CC795; --warn: #E3A54A; --bad: #E77A70;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); --stage-tint: 255,255,255; color-scheme: dark; }

  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -.015em; }
  p { margin: 0; }
  .eyebrow { font: 500 11.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ------------------------------------------------------------------ shell */
  .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
  .rail { position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 6px; padding: 22px 14px 18px; border-right: 1px solid var(--line); background: var(--paper); }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
  .brand svg { width: 30px; height: 30px; flex: none; }
  .brand b { font: 700 21px/1 var(--display); letter-spacing: -.02em; }
  .brand small { display: block; font: 500 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-top: 4px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; border-radius: 10px; padding: 10px 12px; color: var(--dim); text-align: left; font-size: 15px; position: relative; }
  .nav button svg { width: 19px; height: 19px; flex: none; }
  .nav button:hover { background: var(--sunk); color: var(--ink); }
  .nav button[aria-current="page"] { background: var(--raised); color: var(--ink); box-shadow: var(--shadow); }
  .nav button[aria-current="page"] svg { color: var(--accent); }
  .nav .count { margin-left: auto; font: 500 11px/1 var(--mono); color: var(--accent); }
  .rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 6px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--raised); border-radius: 999px; padding: 6px 12px 6px 10px; font-size: 13px; color: var(--dim); max-width: 100%; }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .pill.on i { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
  .pill.demo i { background: var(--blue); }
  .pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .main { min-width: 0; }
  .view { min-height: 100vh; min-height: 100dvh; }

  /* --------------------------------------------------------------- welcome */
  .welcome { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: grid; place-items: center; padding: 24px 20px; overflow: auto; }
  .welcome::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(60vmax 40vmax at 78% 12%, var(--accent-soft), transparent 60%), radial-gradient(50vmax 40vmax at 8% 96%, var(--blue-soft), transparent 60%); }
  .welcome-in { position: relative; max-width: 720px; width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 22px; }
  .welcome .mark { width: 72px; height: 72px; }
  .welcome h1 { font-size: clamp(44px, 9vw, 88px); line-height: .95; font-weight: 700; letter-spacing: -.035em; }
  .welcome h1 em { font-style: normal; color: var(--accent); }
  .welcome .lede { font-size: clamp(17px, 2.2vw, 20px); color: var(--dim); max-width: 34em; }
  .welcome .points { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; width: 100%; margin-top: 6px; }
  .welcome .point { border-top: 2px solid var(--accent); padding-top: 12px; font-size: 14.5px; color: var(--dim); }
  .welcome .point b { display: block; color: var(--ink); font-family: var(--display); font-size: 16px; margin-bottom: 2px; }
  .welcome .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .welcome .by { font: 500 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-top: 12px; }
  @media (max-width: 640px) { .welcome .points { grid-template-columns: 1fr; } }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--raised); color: var(--ink); border-radius: 999px; padding: 11px 20px; font-weight: 700; font-size: 15px; transition: transform .12s ease, background .15s ease, border-color .15s ease; }
  .btn:hover { border-color: var(--ink); }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 20px var(--accent-glow); }
  .btn.primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
  .btn.quiet { border-color: transparent; background: none; color: var(--dim); }
  .btn.quiet:hover { color: var(--ink); }
  .btn.small { padding: 7px 14px; font-size: 13.5px; }
  .btn.danger { color: var(--bad); }
  .btn[disabled] { opacity: .5; cursor: default; }

  /* ------------------------------------------------------------------ talk */
  .talk { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 100vh; min-height: 100dvh; }
  .convo { display: flex; flex-direction: column; min-width: 0; padding: 28px clamp(18px, 4vw, 56px) 20px; }
  .side { border-left: 1px solid var(--line); background: var(--paper); padding: 24px 22px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  .presence { display: flex; align-items: center; gap: 18px; padding: 6px 0 14px; }
  .orb { width: 64px; height: 64px; flex: none; position: relative; display: grid; place-items: center; border-radius: 50%; background: var(--raised); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); }
  .orb::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; transform: scale(.9); }
  .orb svg { width: 34px; height: 34px; }
  .orb .bar { transform-origin: 60px 52px; }
  .orb .rest { transform-origin: 60px 63px; }
  .orb[data-state="idle"] .rest { animation: breathe 4.2s ease-in-out infinite; }
  .orb[data-state="listening"]::before { animation: ring 1.6s ease-out infinite; }
  .orb[data-state="thinking"] .rest { animation: think 1s ease-in-out infinite; }
  .orb[data-state="speaking"] .rest { animation: speak .42s ease-in-out infinite alternate; }
  @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.82); } }
  @keyframes ring { 0% { opacity: .7; transform: scale(.92); } 100% { opacity: 0; transform: scale(1.25); } }
  @keyframes think { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes speak { from { transform: scaleY(.55); } to { transform: scaleY(1.15); } }
  .presence .who b { font: 700 18px/1.1 var(--display); }
  .presence .who span { display: block; font-size: 13.5px; color: var(--dim); margin-top: 2px; }

  .now { font: 600 clamp(24px, 3.1vw, 34px)/1.25 var(--display); letter-spacing: -.02em; max-width: 26em; min-height: 2.5em; padding: 6px 0 22px; }
  .now .w { opacity: 0; animation: word .32s ease forwards; }
  @keyframes word { from { opacity: 0; transform: translateY(4px); filter: blur(2px); } to { opacity: 1; transform: none; filter: none; } }
  .now.answer { font-size: clamp(19px, 2.2vw, 23px); font-weight: 500; line-height: 1.45; }

  .log { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 4px 0 18px; overflow: auto; min-height: 120px; max-height: 42vh; border-top: 1px solid var(--line); padding-top: 18px; }
  .msg { max-width: 78%; padding: 10px 15px; border-radius: 18px; font-size: 15px; line-height: 1.45; white-space: pre-line; animation: rise .25s ease; }
  .msg.me { align-self: flex-end; background: var(--ink); color: var(--bg); border-bottom-right-radius: 6px; }
  .msg.it { align-self: flex-start; background: var(--sunk); border-bottom-left-radius: 6px; color: var(--ink); }
  .msg.note { align-self: center; background: none; color: var(--faint); font-size: 13px; padding: 2px 0; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .offers { display: flex; flex-wrap: wrap; gap: 8px; }
  .composer { display: flex; align-items: center; gap: 8px; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 22px; padding: 6px 6px 6px 18px; box-shadow: var(--shadow); transition: border-color .15s ease, box-shadow .15s ease; }
  .composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
  .composer input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; padding: 10px 0; font-size: 16px; }
  .icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--sunk); color: var(--ink); flex: none; transition: background .15s ease, transform .12s ease; }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn:active { transform: scale(.95); }
  .icon-btn.send { background: var(--accent); color: var(--accent-ink); }
  .icon-btn.live { background: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 6px var(--accent-soft); }
  .hint { font-size: 12.5px; color: var(--faint); padding: 8px 6px 0; display: flex; gap: 14px; flex-wrap: wrap; }
  .hint button { border: 0; background: none; padding: 0; color: var(--dim); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; font-size: 12.5px; }
  .hint button:hover { color: var(--accent); }

  .chip { border: 1px solid var(--line-strong); background: var(--raised); border-radius: 999px; padding: 7px 14px; font-size: 14px; transition: border-color .15s ease, background .15s ease; }
  .chip:hover { border-color: var(--accent); }
  .chip.yes { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

  /* The Stage card, re-skinned from the outside: its own rules stay its own. */
  eui-stage { display: block; min-width: 0; --eui-ink: var(--ink); --eui-tint: var(--stage-tint);
    --eui-mint: var(--accent); --eui-planPurple: var(--accent); --eui-rewardsGold: var(--accent); --eui-cyan: var(--accent); --eui-poppinsCyan: var(--accent); --eui-neutral: var(--accent);
    --eui-success: var(--ok); --eui-warning: var(--accent); --eui-danger: var(--bad);
    --eui-font: var(--body); }
  .card-wrap { background: var(--raised); border: 1px solid var(--line); border-radius: 22px; padding: 14px; box-shadow: var(--shadow); }
  .side h3 { font-size: 15px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .learned { display: flex; flex-direction: column; gap: 8px; }
  .learned .f { font-size: 14px; padding: 9px 12px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); animation: rise .3s ease; }
  .learned .f small { display: block; color: var(--faint); font-size: 12px; margin-top: 2px; }
  .meter { display: flex; align-items: center; gap: 10px; font: 500 12.5px/1 var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
  .meter .track { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .meter .fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-deep)); border-radius: 3px; transition: width .6s ease; }

  /* -------------------------------------------------------------- sections */
  .page { max-width: 1040px; padding: 36px clamp(18px, 4vw, 48px) 120px; display: flex; flex-direction: column; gap: 24px; }
  .page-head { display: flex; flex-direction: column; gap: 8px; }
  .page-head h1 { font-size: clamp(30px, 4.4vw, 42px); }
  .page-head p { color: var(--dim); max-width: 60ch; }
  .panel { background: var(--raised); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); min-width: 0; }
  .panel-pad { padding: 20px 22px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  .stat { display: flex; flex-direction: column; gap: 4px; }
  .stat b { font: 700 40px/1 var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--dim); font-size: 14px; }

  .rows > * { padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .rows > *:last-child { border-bottom: 0; }
  .notice { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: start; animation: rise .25s ease; }
  .notice .t { font-weight: 700; }
  .notice .w { color: var(--dim); font-size: 14px; }
  .notice time { font: 400 12px/1.8 var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; }
  .dot.now { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .dot.bundle { border: 2px solid var(--blue); }
  .dot.briefing { background: var(--line-strong); }
  .legend { display: flex; flex-wrap: wrap; gap: 18px; font-size: 13.5px; color: var(--dim); }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .legend .dot { margin: 0; }
  .empty { color: var(--faint); font-size: 14.5px; padding: 22px 20px; }

  .brief { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
  .brief .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .brief .col h3 { font-size: 16px; padding-bottom: 8px; border-bottom: 2px solid var(--accent); }
  .item { padding: 12px 14px; border-radius: 14px; background: var(--raised); border: 1px solid var(--line); }
  .item .why { color: var(--faint); font-size: 13px; margin-top: 4px; }
  .hero-brief { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding: 22px; background: linear-gradient(120deg, var(--accent-soft), transparent 70%), var(--raised); }
  .hero-brief .big { font: 700 26px/1.15 var(--display); }

  .bars { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: minmax(0, 12em) minmax(0, 1fr) 3.4em; gap: 12px; align-items: center; font-size: 14px; }
  .bar-row .track { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar-row .fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width .6s ease; }
  .bar-row .n { font: 400 12px/1 var(--mono); color: var(--faint); text-align: right; font-variant-numeric: tabular-nums; }
  .fact { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; }
  .fact q { display: block; color: var(--faint); font-size: 13.5px; margin-top: 3px; }
  .link { border: 0; background: none; color: var(--dim); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-strong); padding: 0; align-self: start; }
  .link:hover { color: var(--bad); }

  /* -------------------------------------------------------------- settings */
  .settings { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 28px; align-items: start; }
  .snav { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 2px; }
  .snav button { border: 0; background: none; text-align: left; padding: 8px 12px; border-radius: 9px; color: var(--dim); font-size: 14.5px; }
  .snav button:hover { color: var(--ink); background: var(--sunk); }
  .snav button[aria-current="true"] { color: var(--ink); background: var(--accent-soft); font-weight: 700; }
  .sec { display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 24px; }
  .sec > h2 { font-size: 22px; }
  .sec > p { color: var(--dim); font-size: 14.5px; max-width: 62ch; }
  .field { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, auto); gap: 8px 18px; align-items: center; }
  .field .l b { display: block; font-weight: 700; font-size: 15px; }
  .field .l span { display: block; color: var(--dim); font-size: 13.5px; }
  .input { width: 100%; border: 1px solid var(--line-strong); background: var(--bg); border-radius: 12px; padding: 10px 14px; font-size: 15px; }
  .input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px; background: var(--bg); flex-wrap: wrap; }
  .seg button { border: 0; background: none; border-radius: 999px; padding: 6px 14px; font-size: 14px; color: var(--dim); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .switch { width: 46px; height: 28px; border-radius: 999px; border: 0; background: var(--line-strong); position: relative; flex: none; transition: background .2s ease; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .2s ease; }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"]::after { left: 21px; }
  .lock { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-top: 6px; display: block; }
  .status { font-size: 14px; padding: 10px 14px; border-radius: 12px; background: var(--sunk); color: var(--dim); }
  .status.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
  .status.bad { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); }
  .tool { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: 14px; }
  .tool small { color: var(--faint); grid-column: 1 / -1; }
  .badge { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 5px 8px; border-radius: 6px; background: var(--sunk); color: var(--dim); align-self: start; }
  .badge.read { background: var(--blue-soft); color: var(--blue); }
  .badge.external { background: var(--accent-soft); color: var(--accent-deep); }
  .code { font: 400 13px/1.6 var(--mono); background: var(--sunk); border-radius: 12px; padding: 12px 14px; overflow-x: auto; white-space: pre; }
  .confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: 12px; background: color-mix(in srgb, var(--bad) 9%, transparent); }

  /* ---------------------------------------------------------------- mobile */
  .tabs { display: none; }
  @media (max-width: 1100px) {
    .talk { grid-template-columns: minmax(0, 1fr); }
    .side { border-left: 0; border-top: 1px solid var(--line); }
    .log { max-height: none; }
  }
