<title>Tacit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #EEF0EA; --surface: #F7F8F4; --raised: #FFFFFF; --ink: #14182B; --dim: #565C6E; --line: rgba(20,24,43,.12);
    --moment: #C8792B; --moment-ink: #FFFFFF; --tile: #14182B; --tile-ink: #EEF0EA; --soft: rgba(200,121,43,.12);
    --display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    /* the Stage element reads these */
    --bg: var(--surface); --fg: var(--ink); --accent: var(--moment); --accent-ink: var(--moment-ink);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --paper: #0F1222; --surface: #161A2E; --raised: #1D2238; --ink: #E7E9E2; --dim: #9AA0B2; --line: rgba(231,233,226,.12);
    --moment: #E0924A; --moment-ink: #14182B; --tile: #E7E9E2; --tile-ink: #14182B; --soft: rgba(224,146,74,.14); color-scheme: dark; } }
  :root[data-theme="dark"] {
    --paper: #0F1222; --surface: #161A2E; --raised: #1D2238; --ink: #E7E9E2; --dim: #9AA0B2; --line: rgba(231,233,226,.12);
    --moment: #E0924A; --moment-ink: #14182B; --tile: #E7E9E2; --tile-ink: #14182B; --soft: rgba(224,146,74,.14); color-scheme: dark; }

  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--body); }
  button, input { font: inherit; color: inherit; }
  .shell { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 96px; display: flex; flex-direction: column; gap: 16px; min-height: 100%; box-sizing: border-box; }
  header.top { display: flex; align-items: center; gap: 12px; }
  header.top svg { width: 34px; height: 34px; flex: none; }
  header.top .name { font: 700 22px/1 var(--display); letter-spacing: -.02em; }
  header.top .when { margin-left: auto; font: 500 12px/1 var(--mono); color: var(--dim); letter-spacing: .06em; text-transform: uppercase; }

  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; gap: 4px; }
  nav.tabs button { flex: 1; max-width: 160px; background: none; border: 0; border-radius: 12px; padding: 8px 4px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--dim); font-size: 13px; }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button[aria-selected="true"] { color: var(--ink); background: var(--soft); }
  nav.tabs .badge { font: 500 11px/1 var(--mono); color: var(--moment); min-height: 11px; }

  .view { display: flex; flex-direction: column; gap: 16px; }
  .view[hidden] { display: none !important; }
  h1 { font: 700 clamp(26px, 5vw, 36px)/1.1 var(--display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
  h2 { font: 600 18px/1.2 var(--display); margin: 0; }
  .lede { color: var(--dim); margin: 0; max-width: 60ch; }
  .eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }

  /* Talk */
  .talk { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .said { min-height: 48px; display: flex; flex-direction: column; gap: 8px; }
  .bubble { align-self: flex-end; background: var(--tile); color: var(--tile-ink); padding: 10px 14px; border-radius: 18px 18px 4px 18px; max-width: 80%; }
  .reply { align-self: flex-start; background: var(--raised); border: 1px solid var(--line); padding: 10px 14px; border-radius: 18px 18px 18px 4px; max-width: 90%; white-space: pre-line; }
  /* The Stage is its own lit surface in both themes: the card language was drawn for a dark ground. */
  eui-stage { display: block; min-width: 0; background: #14182B; color: #EEF0EA; border-radius: 24px; padding: 16px; min-height: 120px; }
  form.ask { display: flex; gap: 8px; }
  form.ask input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--raised); border-radius: 999px; padding: 12px 18px; }
  form.ask input:focus { outline: 2px solid var(--moment); outline-offset: 1px; }
  .go { border: 0; border-radius: 999px; padding: 0 20px; background: var(--moment); color: var(--moment-ink); font-weight: 700; cursor: pointer; }
  .tries { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
  .chip:hover { border-color: var(--moment); }

  .iv { display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: 20px; background: var(--soft); border: 1px solid var(--line); }
  .iv[hidden] { display: none !important; }
  .iv-sum { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
  .chip.primary { background: var(--moment); color: var(--moment-ink); border-color: var(--moment); font-weight: 700; }

  .cover { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .cover .big { font: 700 44px/1 var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .bars { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .bar { display: grid; grid-template-columns: minmax(0, 11em) minmax(0, 1fr) 3.5em; gap: 10px; align-items: center; font-size: 14px; }
  .bar .track { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar .fill { height: 100%; background: var(--moment); border-radius: 4px; }
  .bar .n { font: 400 12px/1 var(--mono); color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
  .fact { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .fact:last-child { border-bottom: 0; }
  .fact q { color: var(--dim); font-size: 14px; display: block; }
  .forget { border: 0; background: none; color: var(--dim); cursor: pointer; font-size: 13px; text-decoration: underline; align-self: start; }
  @media (max-width: 560px) { .bar { grid-template-columns: minmax(0, 8em) minmax(0, 1fr) 3em; } }

  /* Desk */
  .list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; }
  .row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); align-items: start; }
  .row:last-child { border-bottom: 0; }
  .row .t { font-weight: 700; }
  .row .w { color: var(--dim); font-size: 14px; }
  .row .at { font: 400 12px/1.6 var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; background: var(--dim); }
  .dot.now { background: var(--moment); }
  .dot.bundle { background: transparent; border: 2px solid var(--dim); box-sizing: border-box; }
  .dot.briefing { background: var(--line); }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; color: var(--dim); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .dot { margin: 0; }
  .incoming { display: flex; flex-wrap: wrap; gap: 8px; }

  /* Morning */
  .morning { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .sec { display: flex; flex-direction: column; gap: 8px; }
  .item { padding: 12px 16px; border-left: 3px solid var(--moment); background: var(--surface); border-radius: 0 12px 12px 0; }
  .item .why { color: var(--dim); font-size: 14px; }
  .meter { font: 500 13px/1 var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
  .play { align-self: flex-start; border: 0; border-radius: 999px; padding: 10px 20px; background: var(--tile); color: var(--tile-ink); font-weight: 700; cursor: pointer; }

  /* Settings */
  .group { display: flex; flex-direction: column; gap: 8px; }
  .set { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .set:last-child { border-bottom: 0; }
  .set .d { color: var(--dim); font-size: 14px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--tile); color: var(--tile-ink); }
  .switch { width: 48px; height: 28px; border-radius: 999px; border: 0; background: var(--line); position: relative; cursor: pointer; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--raised); transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch[aria-checked="true"] { background: var(--moment); }
  .switch[aria-checked="true"]::after { left: 23px; }
  .lock { font: 500 11px/1 var(--mono); color: var(--moment); letter-spacing: .06em; text-transform: uppercase; }
  .log { font: 400 13px/1.7 var(--mono); color: var(--dim); }

  @media (max-width: 560px) { .set { grid-template-columns: minmax(0, 1fr); } .set .seg { justify-self: start; } }
  @media (min-width: 900px) {
    .talk { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; }
    .morning { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) { .switch::after { transition: none; } }
</style>
