<title>Silence Commits</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root{
    --ground:#eef0f3; --surface:#fff; --sunk:#e4e7ec; --line:#d3d8df; --line-soft:#e6e9ee;
    --ink:#13171d; --dim:#5b636e; --faint:#8b939e;
    --hold:#b0740f; --hold-soft:#f3e3c4;
    --ok:#0d7565; --ok-soft:#cfe9e4;
    --stop:#a32d3c; --stop-soft:#f4d7da;
    --prov:#6b4fa8; --prov-soft:#e3daf5;
    --shadow:0 1px 2px rgba(18,22,28,.07),0 8px 24px -12px rgba(18,22,28,.18);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --ground:#0d1015; --surface:#161b22; --sunk:#10141a; --line:#272e39; --line-soft:#1d232c;
      --ink:#e7eaef; --dim:#99a2af; --faint:#6c7784;
      --hold:#e8ad48; --hold-soft:#3a2d12;
      --ok:#44cfb8; --ok-soft:#10332e;
      --stop:#f4737f; --stop-soft:#3a1a1f;
      --prov:#b49af0; --prov-soft:#241d38;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --ground:#0d1015; --surface:#161b22; --sunk:#10141a; --line:#272e39; --line-soft:#1d232c;
    --ink:#e7eaef; --dim:#99a2af; --faint:#6c7784;
    --hold:#e8ad48; --hold-soft:#3a2d12;
    --ok:#44cfb8; --ok-soft:#10332e;
    --stop:#f4737f; --stop-soft:#3a1a1f;
    --prov:#b49af0; --prov-soft:#241d38;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  body{
    background:var(--ground); color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
    font-size:15px; line-height:1.5; margin:0;
  }
  .wrap{max-width:1140px; margin:0 auto; padding-inline:16px; padding-block:28px 56px;}
  h1,h2,h3,.lbl{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;}
  code,.mono,.rd{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;}

  header{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 14px; margin-bottom:6px}
  h1{font-size:26px; font-weight:600; letter-spacing:-.01em; margin:0; text-wrap:balance}
  .tag{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--faint);
       border:1px solid var(--line); border-radius:999px; padding:3px 9px}
  .sub{color:var(--dim); max-width:66ch; margin:0 0 22px}

  .cols{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr); gap:18px; align-items:start}
  @media (max-width:860px){ .cols{grid-template-columns:1fr} }

  .panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow)}
  .panel > .head{display:flex; justify-content:space-between; align-items:center; gap:10px;
       padding:11px 16px; border-bottom:1px solid var(--line-soft)}
  .lbl{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:600}

  /* stage */
  .stage{padding:22px 16px 18px; min-height:330px; display:flex; flex-direction:column; align-items:center; gap:16px}
  .orbwrap{position:relative; width:132px; height:132px; flex:none}
  .orb{position:absolute; inset:18px; border-radius:50%;
       background:radial-gradient(circle at 34% 30%, var(--surface), var(--sunk) 62%, var(--line) 100%);
       border:1px solid var(--line); transition:box-shadow .3s, border-color .3s}
  .orb.listening{border-color:var(--prov); box-shadow:0 0 0 4px var(--prov-soft)}
  .orb.holding{border-color:var(--hold); box-shadow:0 0 0 4px var(--hold-soft)}
  .orb.done{border-color:var(--ok); box-shadow:0 0 0 4px var(--ok-soft)}
  .orb.blocked{border-color:var(--stop); box-shadow:0 0 0 4px var(--stop-soft)}
  .ring{position:absolute; inset:0; transform:rotate(-90deg)}
  .ring circle{fill:none; stroke-width:5; stroke-linecap:round}
  .ring .track{stroke:var(--line-soft)}
  .ring .arc{stroke:var(--hold); transition:stroke .2s}
  .ms{position:absolute; inset:0; display:grid; place-items:center; font-size:13px; font-weight:500;
      color:var(--dim); letter-spacing:.02em; font-variant-numeric:tabular-nums}

  .utter{font-size:17px; text-align:center; min-height:26px; color:var(--ink); max-width:46ch}
  .utter .none{color:var(--faint)}

  .slots{display:flex; flex-wrap:wrap; gap:9px; justify-content:center; min-height:44px}
  .slot{display:flex; flex-direction:column; gap:3px; align-items:flex-start;
        border:1px solid var(--line); border-radius:10px; padding:7px 11px; background:var(--sunk)}
  .slot .k{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint)}
  .slot .v{font-size:14px; font-weight:500}
  .slot.empty{border-style:dashed; opacity:.75}
  .slot.empty .v{color:var(--faint)}
  .slot.prov{border-color:var(--prov); background:var(--prov-soft)}
  .slot.prov .k{color:var(--prov)}
  .slot.focus{outline:2px solid var(--prov); outline-offset:1px}

  .verdict{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; text-align:center}
  .pill{font-size:12px; font-weight:500; border-radius:999px; padding:4px 11px; border:1px solid transparent}
  .pill.hold{background:var(--hold-soft); color:var(--hold); border-color:var(--hold)}
  .pill.ok{background:var(--ok-soft); color:var(--ok); border-color:var(--ok)}
  .pill.stop{background:var(--stop-soft); color:var(--stop); border-color:var(--stop)}
  .pill.prov{background:var(--prov-soft); color:var(--prov); border-color:var(--prov)}
  .why{font-size:13px; color:var(--dim); max-width:48ch}

  .act-row{display:flex; gap:9px; flex-wrap:wrap; justify-content:center}
  button{font:inherit; cursor:pointer; border-radius:9px; border:1px solid var(--line);
         background:var(--surface); color:var(--ink); padding:8px 13px; transition:border-color .15s, background .15s}
  button:hover{border-color:var(--faint)}
  button:focus-visible{outline:2px solid var(--prov); outline-offset:2px}
  button.primary{background:var(--ok); border-color:var(--ok); color:#fff; font-weight:500}
  button.danger{background:var(--stop); border-color:var(--stop); color:#fff; font-weight:500}
  button.ghost{background:transparent}
  button[disabled]{opacity:.42; cursor:not-allowed}

  /* readout */
  .rd{padding:14px 16px; font-size:12.5px; line-height:1.75; overflow-x:auto}
  .rd .row{display:grid; grid-template-columns:118px minmax(0,1fr); gap:10px; align-items:baseline}
  .rd .key{color:var(--faint)}
  .rd .val{color:var(--ink); word-break:break-word}
  .rd .val.hold{color:var(--hold)} .rd .val.ok{color:var(--ok)}
  .rd .val.stop{color:var(--stop)} .rd .val.prov{color:var(--prov)}
  .rd hr{border:0; border-top:1px solid var(--line-soft); margin:10px 0}
  .rd .fail{color:var(--stop)}

  .log{padding:8px 16px 16px; max-height:190px; overflow-y:auto; font-size:12px}
  .log div{display:grid; grid-template-columns:52px minmax(0,1fr); gap:9px; padding:2.5px 0; border-bottom:1px solid var(--line-soft)}
  .log .t{color:var(--faint); font-variant-numeric:tabular-nums}
  .log .m{color:var(--dim)}
  .log .m b{color:var(--ink); font-weight:500}

  /* controls */
  .controls{margin-top:18px}
  .cbody{padding:14px 16px; display:flex; flex-direction:column; gap:13px}
  .say{display:flex; gap:8px; flex-wrap:wrap}
  .say input{flex:1 1 220px; min-width:0; font:inherit; padding:9px 12px; border-radius:9px;
             border:1px solid var(--line); background:var(--sunk); color:var(--ink)}
  .say input:focus-visible{outline:2px solid var(--prov); outline-offset:1px}
  .chips{display:flex; gap:8px; flex-wrap:wrap}
  .chips button{font-size:13px; padding:7px 11px}
  .chips button .r{font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); margin-left:7px}
  .toggles{display:flex; gap:9px; flex-wrap:wrap; border-top:1px solid var(--line-soft); padding-top:13px}
  .tg{display:flex; align-items:center; gap:7px; font-size:13px; border:1px solid var(--line);
      border-radius:999px; padding:5px 12px 5px 9px; cursor:pointer; background:var(--surface)}
  .tg input{accent-color:var(--prov); margin:0}
  .tg.off{color:var(--dim)}

  .note{margin-top:22px; font-size:13px; color:var(--dim); max-width:72ch}
  .note b{color:var(--ink); font-weight:500}
  .note code{background:var(--sunk); border:1px solid var(--line-soft); border-radius:5px; padding:1px 5px; font-size:12px}
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
