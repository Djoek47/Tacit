<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clean</title>
<style>body{margin:0;padding:0 16px;font:16px sans-serif} button{min-width:44px;min-height:44px}</style></head>
<body><h1>Tasks</h1><p>Say what you need.</p><input id="say" aria-label="Say" style="min-height:44px;width:100%;box-sizing:border-box"><button id="go">Say</button><label style="display:inline-flex;align-items:center;min-height:44px;min-width:44px"><input type="checkbox" id="remind"> Remind me</label><p id="out"></p>
<script>document.getElementById('go').onclick=()=>{document.getElementById('out').textContent='Added: '+document.getElementById('say').value}</script>
</body></html>
